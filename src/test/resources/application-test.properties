
# H2 in-memory database for automated tests
spring.datasource.url=jdbc:h2:mem:taskmanager-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Create database schema for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test-only security configuration
jwt.secret=TestOnlyJwtSecretKeyForTaskManager123456789

# Test-only email configuration
spring.mail.username=test@example.com
spring.mail.password=test-password
