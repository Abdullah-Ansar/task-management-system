services:

  mysql:
    image: mysql:8.4
    container_name: mysql-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ultron1/0
      MYSQL_DATABASE: task_manager

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  taskmanager:
    build: .
    container_name: taskmanager-app

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/task_manager
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ultron1/0

volumes:
  mysql-data: